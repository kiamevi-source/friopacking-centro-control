<meta charset="utf-8">
<title>Centro de Control · Ingeniería — Grupo Friopacking</title>
<style>
  :root{
    --bg:#FBFCFE; --bg-sunk:#F2F5FB; --panel:#FFFFFF; --panel-2:#F6F9FD;
    --ink:#0A1330; --ink-2:#33405E; --muted:#6A7690; --faint:#98A3BC;
    --line:#E4E9F3; --line-2:#EEF2F9;
    --blue:#13277F; --blue-ink:#1E3AA0; --blue-soft:#E9EDFA;
    --teal:#0FA896; --teal-strong:#38C0A8; --teal-ink:#0A7D71; --teal-soft:#E1F6F2;
    --aurora:linear-gradient(120deg,#0E1F6E 0%,#28409C 46%,#38C0A8 100%);
    --aurora-soft:linear-gradient(120deg,#E9EDFA,#E1F6F2);
    --good:#10B981; --good-soft:#E7F7F0; --warn:#F59E0B; --warn-soft:#FDF2E0;
    --crit:#EF4444; --crit-soft:#FCEBEB;
    --r-sm:9px; --r:13px; --r-lg:18px;
    --sh-1:0 1px 2px rgba(8,24,96,.05),0 1px 1px rgba(8,24,96,.03);
    --sh-2:0 4px 14px rgba(8,24,96,.08),0 1px 3px rgba(8,24,96,.05);
    --sh-3:0 18px 48px rgba(8,24,96,.16),0 4px 12px rgba(8,24,96,.08);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#070B14; --bg-sunk:#050810; --panel:#0F1626; --panel-2:#0C1320;
    --ink:#EAF0FB; --ink-2:#C0CADC; --muted:#8794AC; --faint:#5A6683;
    --line:#1D2740; --line-2:#161F33;
    --blue:#5C7CEC; --blue-ink:#8AA3F5; --blue-soft:#13203E;
    --teal:#3FD6C4; --teal-strong:#38C0A8; --teal-ink:#6FE3D4; --teal-soft:#0C2A28;
    --aurora:linear-gradient(120deg,#3D5BD6 0%,#4F86F0 45%,#3FD6C4 100%);
    --aurora-soft:linear-gradient(120deg,#13203E,#0C2A28);
    --good:#34D3A0; --good-soft:#0E2A22; --warn:#F5B34B; --warn-soft:#2A2110;
    --crit:#F87171; --crit-soft:#2A1414;
    --sh-1:0 1px 2px rgba(0,0,0,.45); --sh-2:0 6px 20px rgba(0,0,0,.5); --sh-3:0 22px 60px rgba(0,0,0,.62);
  }}
  :root[data-theme="dark"]{
    --bg:#070B14; --bg-sunk:#050810; --panel:#0F1626; --panel-2:#0C1320;
    --ink:#EAF0FB; --ink-2:#C0CADC; --muted:#8794AC; --faint:#5A6683;
    --line:#1D2740; --line-2:#161F33;
    --blue:#5C7CEC; --blue-ink:#8AA3F5; --blue-soft:#13203E;
    --teal:#3FD6C4; --teal-strong:#38C0A8; --teal-ink:#6FE3D4; --teal-soft:#0C2A28;
    --aurora:linear-gradient(120deg,#3D5BD6 0%,#4F86F0 45%,#3FD6C4 100%);
    --aurora-soft:linear-gradient(120deg,#13203E,#0C2A28);
    --good:#34D3A0; --good-soft:#0E2A22; --warn:#F5B34B; --warn-soft:#2A2110;
    --crit:#F87171; --crit-soft:#2A1414;
    --sh-1:0 1px 2px rgba(0,0,0,.45); --sh-2:0 6px 20px rgba(0,0,0,.5); --sh-3:0 22px 60px rgba(0,0,0,.62);
  }
  :root[data-theme="light"]{
    --bg:#FBFCFE; --bg-sunk:#F2F5FB; --panel:#FFFFFF; --panel-2:#F6F9FD;
    --ink:#0A1330; --ink-2:#33405E; --muted:#6A7690; --faint:#98A3BC;
    --line:#E4E9F3; --line-2:#EEF2F9;
    --blue:#13277F; --blue-ink:#1E3AA0; --blue-soft:#E9EDFA;
    --teal:#0FA896; --teal-strong:#38C0A8; --teal-ink:#0A7D71; --teal-soft:#E1F6F2;
    --aurora:linear-gradient(120deg,#0E1F6E 0%,#28409C 46%,#38C0A8 100%);
    --aurora-soft:linear-gradient(120deg,#E9EDFA,#E1F6F2);
    --good:#10B981; --good-soft:#E7F7F0; --warn:#F59E0B; --warn-soft:#FDF2E0;
    --crit:#EF4444; --crit-soft:#FCEBEB;
    --sh-1:0 1px 2px rgba(8,24,96,.05),0 1px 1px rgba(8,24,96,.03);
    --sh-2:0 4px 14px rgba(8,24,96,.08),0 1px 3px rgba(8,24,96,.05);
    --sh-3:0 18px 48px rgba(8,24,96,.16),0 4px 12px rgba(8,24,96,.08);
  }
  *{box-sizing:border-box}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{margin:0}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .icn{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .icn.sm{width:14px;height:14px}
  .b{font-weight:640;color:var(--ink)} .muted{color:var(--muted)}

  .shell{display:grid;grid-template-columns:232px 1fr;height:100vh;overflow:hidden}
  .sidebar{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:12px 12px 12px;overflow-y:auto}
  .brandrow{display:flex;align-items:center;gap:9px;padding:4px 6px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .brandrow img{width:28px;height:28px;object-fit:contain;flex:none}
  .brandrow .nm{font-size:13px;font-weight:700;line-height:1.05}
  .brandrow small{display:block;font-size:9px;color:var(--muted);font-weight:520}
  .grp{font-size:10px;font-weight:660;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:14px 8px 5px}
  .nav{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;font-size:13px;color:var(--ink-2);font-weight:530;border:none;background:transparent;width:100%;text-align:left}
  .nav:hover{background:var(--panel-2);color:var(--ink)}
  .nav.on{background:var(--blue-soft);color:var(--blue-ink);font-weight:620}
  .nav .badge{margin-left:auto;background:var(--crit);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:0 6px;min-width:17px;height:17px;display:grid;place-items:center}
  .nav .badge.mut{background:var(--line);color:var(--muted)}
  .side-foot{margin-top:auto;padding-top:10px}

  .main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
  .topbar{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);flex:none}
  .topbar h2{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .searchbar{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--muted);font-size:12.5px;min-width:180px;cursor:text}
  .searchbar .k{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;position:relative}
  .iconbtn:hover{color:var(--ink)}
  .iconbtn .dotb{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:99px;background:var(--crit);border:1.5px solid var(--panel)}
  .content{flex:1;overflow-y:auto;padding:22px 24px 60px}

  @media(max-width:820px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;z-index:60;width:232px;height:100vh;transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:none}.menu-btn{display:grid!important}}
  .menu-btn{display:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;width:34px;height:34px;place-items:center}

  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2)}
  .chip.blue{background:var(--blue-soft);border-color:transparent;color:var(--blue-ink)}
  .chip.teal{background:var(--teal-soft);border-color:transparent;color:var(--teal-ink)}
  .chip.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
  .chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
  .chip.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
  .dot{width:7px;height:7px;border-radius:99px;flex:none;background:var(--muted)}
  .dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}.dot.blue{background:var(--blue)}.dot.teal{background:var(--teal)}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:580;font-size:13px;padding:8px 14px;border-radius:var(--r-sm);display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--blue)}
  .btn.pri{background:var(--blue);border-color:transparent;color:#fff}
  .btn.pri:hover{filter:brightness(1.08)}
  .btn.aur{background:var(--aurora);border-color:transparent;color:#fff}
  .btn.gho{background:transparent}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
  .seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{border:none;background:transparent;color:var(--muted);font-size:12.5px;font-weight:560;padding:5px 12px;border-radius:7px}
  .seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh-1)}
  .prog{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
  .prog>i{display:block;height:100%;border-radius:99px;background:var(--aurora)}
  .avatar{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;font-size:11px;font-weight:680;color:#fff;flex:none}
  .spe{font-size:9.5px;font-weight:640;letter-spacing:.04em;padding:1px 6px;border-radius:5px}
  .spe.re{background:var(--teal-soft);color:var(--teal-ink)}.spe.el{background:var(--warn-soft);color:var(--warn)}
  .spe.es{background:var(--blue-soft);color:var(--blue-ink)}.spe.ci{background:#EFEAFB;color:#6D45C9}
  @media(prefers-color-scheme:dark){.spe.ci{background:#221a35;color:#a988ff}}
  :root[data-theme="dark"] .spe.ci{background:#221a35;color:#a988ff}
  .grid2{display:grid;grid-template-columns:1.35fr .95fr;gap:14px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .stackcol{display:flex;flex-direction:column;gap:14px}
  .rowgap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .secttitle{font-size:20px;font-weight:730;letter-spacing:-.02em;margin-bottom:3px}
  .sectsub{font-size:13px;color:var(--muted);margin-bottom:18px}
  .breadcrumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
  .breadcrumb button{color:var(--muted);border:none;background:none;cursor:pointer;font-size:12px;padding:0}
  .breadcrumb button:hover{color:var(--blue-ink)}
  .breadcrumb .sep{opacity:.5}
  .breadcrumb .cur{color:var(--ink);font-weight:600}

  .kpi4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:700px){.kpi4{grid-template-columns:1fr 1fr}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative;overflow:hidden;text-align:left}
  .kpi.click{cursor:pointer} .kpi.click:hover{border-color:var(--blue);box-shadow:var(--sh-2)}
  .kpi .lab{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .kpi .val{font-size:25px;font-weight:740;letter-spacing:-.02em;margin-top:6px}
  .kpi .delta{font-size:11.5px;font-weight:620;margin-top:3px}
  .kpi .delta.up{color:var(--good)}.kpi .delta.down{color:var(--crit)}
  .kpi .rail{position:absolute;left:0;top:0;bottom:0;width:3px}
  .kpi .spark{position:absolute;right:10px;bottom:8px;width:60px;height:26px;opacity:.9}
  .panelbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px}
  .ph{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .ph h4{font-size:13.5px;font-weight:660}
  .ph .more{margin-left:auto;font-size:11.5px;color:var(--blue-ink);font-weight:560;background:none;border:none}

  .task{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;border:1px solid var(--line);background:var(--panel);margin-bottom:8px;cursor:pointer}
  .task:hover{border-color:var(--blue)}
  .ck{width:18px;height:18px;border-radius:6px;border:1.8px solid var(--line);flex:none;position:relative}
  .ck.on{background:var(--blue);border-color:transparent}
  .ck.on::after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
  .task .tt{font-size:13.5px;font-weight:560}.task .tt .cd{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .task .rt{margin-left:auto;display:flex;gap:8px}
  .task.done .tt{color:var(--faint);text-decoration:line-through}

  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:760px){.board{grid-template-columns:1fr 1fr}}
  .col-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:640;margin-bottom:9px}
  .col-h .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:0 7px}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:var(--sh-1);cursor:pointer}
  .pcard:hover{border-color:var(--blue);transform:translateY(-1px);transition:.12s}
  .pcard .cd{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .pcard .ti{font-size:12.5px;font-weight:580;margin:3px 0 8px}
  .pcard .ft{display:flex;align-items:center;gap:7px}

  .cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:900px){.cards3{grid-template-columns:1fr 1fr}}
  @media(max-width:600px){.cards3{grid-template-columns:1fr}}
  .entity{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--sh-1);text-align:left;width:100%}
  .entity:hover{border-color:var(--blue);transform:translateY(-1px);transition:.12s}
  .entity .ava{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:15px;font-weight:700;color:#fff;flex:none;background:var(--aurora)}
  .entity .nm{font-size:14px;font-weight:640}
  .entity .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .entity .rt{margin-left:auto;text-align:right;flex:none}

  .esp-card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--sh-1);padding:15px;margin-bottom:12px}
  .esp-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .esp-head h4{font-size:14px;font-weight:660}
  .esp-head .tot{margin-left:auto;font-size:12px;color:var(--muted)}
  .person-row{display:flex;align-items:center;gap:11px;padding:7px 0}
  .person-row .nm{width:160px;font-size:12.5px;display:flex;align-items:center;gap:8px;flex:none}
  .person-row .cbar{flex:1;height:16px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line-2);position:relative;overflow:hidden}
  .person-row .cbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--aurora)}
  .person-row .cnt{width:78px;text-align:right;font-size:12px;font-weight:640;flex:none}

  .cap{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .cap:last-child{border-bottom:none}
  .cap .nm{width:150px;font-size:12.5px;font-weight:560;display:flex;align-items:center;gap:8px;flex:none}
  .cap .bar{flex:1;height:20px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line-2);position:relative;overflow:hidden}
  .cap .bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .5s}
  .cap .np{width:74px;text-align:right;font-size:11.5px;color:var(--muted);flex:none}
  .cap .pct{width:52px;text-align:right;font-size:12px;font-weight:640;flex:none;font-variant-numeric:tabular-nums}

  .gantt{font-size:12px}
  .gantt .row{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:10px;padding:5px 0}
  .gantt .lb{color:var(--ink-2);font-weight:540;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gantt .lb.sub{padding-left:14px;color:var(--muted);font-size:11.5px}
  .gantt .track{position:relative;height:20px;background:var(--panel-2);border-radius:6px;border:1px solid var(--line-2)}
  .gantt .bar{position:absolute;top:3px;height:14px;border-radius:5px;background:var(--aurora);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;padding:0 6px}
  .gantt .bar.warn{background:linear-gradient(120deg,#F59E0B,#F6C15A)}.gantt .bar.crit{background:linear-gradient(120deg,#EF4444,#F87171)}
  .gantt .today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--teal);z-index:2}
  .gantt .today::after{content:"HOY";position:absolute;top:-14px;left:-11px;font-size:8px;font-weight:800;color:var(--teal-ink)}

  .matrix{display:grid;grid-template-columns:26px repeat(5,1fr);gap:5px;max-width:420px}
  .matrix .yl{writing-mode:vertical-rl;transform:rotate(180deg);grid-row:1/6;grid-column:1;font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--muted);display:grid;place-items:center;text-transform:uppercase}
  .cell{border-radius:7px;min-height:50px;display:grid;place-items:center;border:1px solid rgba(0,0,0,.04)}
  .cell .rk{width:22px;height:22px;border-radius:99px;background:var(--panel);border:2px solid var(--ink);display:grid;place-items:center;font-size:10px;font-weight:800;box-shadow:var(--sh-1);cursor:pointer}
  .g1{background:var(--good-soft)}.g2{background:#EAF6E4}.g3{background:var(--warn-soft)}.g4{background:#FBE4D6}.g5{background:var(--crit-soft)}
  @media(prefers-color-scheme:dark){.g2{background:#16241a}.g4{background:#2a1c14}}
  :root[data-theme="dark"] .g2{background:#16241a}:root[data-theme="dark"] .g4{background:#2a1c14}
  .xaxis{grid-column:2/7;display:flex;justify-content:space-between;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-top:4px}
  .risk-r{display:flex;align-items:center;gap:10px;padding:9px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
  .risk-r .rk{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex:none}

  .htbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .htbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:640;padding:8px 10px;border-bottom:1px solid var(--line)}
  .htbl td{padding:9px 10px;border-bottom:1px solid var(--line-2)}
  .htbl tr:last-child td{border-bottom:none}
  .hbar{height:8px;border-radius:99px;background:var(--panel-2);position:relative;overflow:hidden;min-width:70px}
  .hbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
  .dev{font-weight:700}.dev.pos{color:var(--crit)}.dev.neg{color:var(--good)}

  .mapwrap{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}
  @media(max-width:820px){.mapwrap{grid-template-columns:1fr}}
  .globe{position:relative;border-radius:var(--r-lg);border:1px solid var(--line);background:radial-gradient(120% 100% at 30% 10%,color-mix(in srgb,var(--blue) 12%,transparent),transparent 60%),var(--panel-2);min-height:330px;overflow:hidden}
  .globe .grat{position:absolute;inset:0;opacity:.5;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px;mask:radial-gradient(70% 70% at 50% 50%,#000,transparent 85%)}
  .mpin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  .mpin .dotp{width:14px;height:14px;border-radius:99px;border:3px solid var(--panel);box-shadow:var(--sh-2)}

  function go(scr){if(!scr)return;S.screen=scr;S.fSpe='';S.fResp='';S.fProj='';sidebar.classList.remove('open');render()}

  // ---- LOGIN ----
  function renderLoginUsers(){$('#loginUsers').innerHTML=users.map(function(u){return '<button class="du" data-login="'+u.ini+'"><span class="avatar" style="width:26px;height:26px;font-size:9px;background:'+(AV[u.ini]||'#13277F')+'">'+u.ini+'</span><div><div style="font-size:12.5px;font-weight:600">'+u.nm+'</div><div style="font-size:10.5px;color:var(--muted)">'+u.mail+'</div></div><span class="rl">'+({gerente:'Gerente',presupuestador:'Presupuestos',comercial:'Comercial',ingeniero:'Ingeniero'}[u.role])+'</span></button>'}).join('')}
  function doLogin(ini){var u=users.filter(function(x){return x.ini===ini})[0];if(!u)return;S.user=u;S.role=u.role;S.screen={gerente:'dashboard',presupuestador:'presupuestos',comercial:'tickets',ingeniero:'mi-dia'}[u.role];S.cliente=null;S.proyecto='chincha2';S.cotiz=null;$('#loginScrim').classList.remove('open');renderUserChip();render();toast('Bienvenida, '+u.nm.split(' ')[0])}
  function logout(){S.active=null;S.user=null;$('#userMenu').classList.remove('open');closeDetail();$('#loginScrim').classList.add('open')}
  function renderUserChip(){if(!S.user)return;$('#userBtn').innerHTML='<span class="avatar" style="width:26px;height:26px;font-size:9px;background:'+(AV[S.user.ini]||'#13277F')+'">'+S.user.ini+'</span><div style="text-align:left"><div class="nm">'+S.user.nm+'</div><div class="rol">'+({gerente:'Gerente de Ingeniería',presupuestador:'Presupuestos',comercial:'Ejecutivo Comercial'}[S.role]||('Ingeniero · '+SPE[S.user.spe]))+'</div></div><svg class="icn sm" viewBox="0 0 24 24" style="color:var(--muted)"><path d="m6 9 6 6 6-6"/></svg>'}

  function toast(msg){var t=document.createElement('div');t.className='toast';t.innerHTML='<span class="ic"><svg class="icn sm" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>'+msg;$('#toasts').appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transition='.3s';setTimeout(function(){t.remove()},300)},2200)}

  var CMDS=[['Ir a · Mi Día','go','mi-dia','home'],['Ir a · Dashboard','go','dashboard','chart'],['Ir a · Clientes','go','clientes','users'],['Ir a · Proyectos','go','proyectos','folder'],['Ir a · Entregables','go','planos','sheet'],['Ir a · Especialidades','go','especialidades','layers'],['Ir a · Carga','go','carga','bars'],['Ir a · Riesgos','go','riesgos','risk'],['Ir a · Horas','go','horas','clock'],['Nuevo entregable (asignar)','new','','sheet'],['Cerrar sesión','logout','','users']];
  function openCmd(){$('#cmdkScrim').classList.add('open');$('#cmdInput').value='';renderCmds('');setTimeout(function(){$('#cmdInput').focus()},30)}
  function closeCmd(){$('#cmdkScrim').classList.remove('open')}
  function renderCmds(q){q=q.toLowerCase();var list=CMDS.filter(function(c){return c[0].toLowerCase().indexOf(q)>-1});$('#cmdList').innerHTML='<div class="sec">Comandos</div>'+(list.map(function(c,i){return '<div class="cmdrow'+(i===0?' on':'')+'" data-cmd="'+c[1]+'" data-arg="'+c[2]+'"><span class="ic">'+ic(c[3]).replace('class="icn"','class="icn sm"')+'</span>'+c[0]+'<span class="kbd">⏎</span></div>'}).join('')||'<div class="cmdrow">Sin resultados</div>')}
  function runCmd(cmd,arg){closeCmd();if(cmd==='go')go(arg);else if(cmd==='new')openModalNew();else if(cmd==='logout')logout()}

  document.addEventListener('click',function(e){
    var t=e.target;
    var lgn=t.closest('[data-login]'); if(lgn){doLogin(lgn.getAttribute('data-login'));return}
    if(t.closest('#loginBtn')){var mail=$('#loginMail').value.trim().toLowerCase();var u=users.filter(function(x){return x.mail===mail})[0];if(u)doLogin(u.ini);else toast('Usuario no encontrado — usa una cuenta de demo');return}
    if(t.closest('#userBtn')){$('#userMenu').classList.toggle('open');return}
    if(t.closest('#switchUser')||t.closest('#logoutBtn')){logout();return}
    var cliBtn=t.closest('[data-cliente]'); if(cliBtn){S.cliente=cliBtn.getAttribute('data-cliente');go('proyectos');return}
    var proyBtn=t.closest('[data-proyecto]'); if(proyBtn){var pid=proyBtn.getAttribute('data-proyecto');S.proyecto=pid;S.cliente=projOf(pid).cli;go('planos');return}
    var nav=t.closest('[data-screen]'); if(nav){go(nav.getAttribute('data-screen'));return}
    var tbtn=t.closest('[data-timerbtn]'); if(tbtn){toggleTimer(tbtn.getAttribute('data-timerbtn'));return}
    var lg=t.closest('[data-log]'); if(lg){toast('2.0 h registradas en '+lg.getAttribute('data-log')+' ✓');return}
    var oc=t.closest('[data-open-comments]'); if(oc){openDetail(oc.getAttribute('data-open-comments'),'comentarios');return}
    if(S.commentMode){var sh=t.closest('.sheet,.fullsheet'); if(sh){var r=sh.getBoundingClientRect();S.pending={x:Math.round((e.clientX-r.left)/r.width*100),y:Math.round((e.clientY-r.top)/r.height*100)};S.commentMode=false;S.tab='comentarios';if($('#fullScrim').classList.contains('open'))closeFull();renderDetail();return}}
    if(t.closest('#startComment')){S.commentMode=!S.commentMode;S.pending=null;renderDetail();if(S.commentMode)toast('Toca el plano donde quieras comentar');return}
    if(t.closest('#commentSave')){var pc=planos.filter(function(x){return x.id===S.plano})[0];var txt=($('#commentText').value||'').trim();if(!txt){toast('Escribe el comentario');return}pc.comments=pc.comments||[];pc.comments.push({x:S.pending.x,y:S.pending.y,by:S.user.ini,text:txt,resolved:false,replies:[]});S.pending=null;renderDetail();toast('Comentario fijado sobre el plano');return}
    if(t.closest('#commentCancel')){S.pending=null;S.commentMode=false;renderDetail();return}
    var rz=t.closest('[data-resolve]'); if(rz){var pr=planos.filter(function(x){return x.id===S.plano})[0];var cc=pr.comments[+rz.getAttribute('data-resolve')];cc.resolved=!cc.resolved;renderDetail();toast(cc.resolved?'Marcado como resuelto':'Reabierto');return}
    var ro=t.closest('[data-reply-open]'); if(ro){S.replyTo=+ro.getAttribute('data-reply-open');renderDetail();var ri=$('#replyInput');if(ri)ri.focus();return}
    var rs=t.closest('[data-reply-send]'); if(rs){var prr=planos.filter(function(x){return x.id===S.plano})[0];var cm=prr.comments[+rs.getAttribute('data-reply-send')];var v=($('#replyInput').value||'').trim();if(v){cm.replies=cm.replies||[];cm.replies.push({by:S.user.ini,text:v})}S.replyTo=null;renderDetail();return}
    var hp=t.closest('[data-help]'); if(hp){var ph=planos.filter(function(x){return x.id===hp.getAttribute('data-help')})[0];ph.help=true;toast('Solicitud de apoyo enviada a R. Guerra');return}
    if(t.closest('#askHelp')){openModalHelp();return}
    var hpk=t.closest('[data-hpick]'); if(hpk){var pid2=hpk.getAttribute('data-hpick');var pp2=planos.filter(function(x){return x.id===pid2})[0];pp2.help=true;closeModal();render();toast('Solicitud de apoyo en '+pid2+' enviada a R. Guerra');return}
    var otk=t.closest('[data-open-ticket]'); if(otk){openTicket(otk.getAttribute('data-open-ticket'));return}
    if(t.closest('#tkClose')){closeTicket();return}
    if(t.closest('#newTicket')){openTicketModal();return}
    var tktp=t.closest('[data-tktipo]'); if(tktp){S.form.tipo=tktp.getAttribute('data-tktipo');[].forEach.call(document.querySelectorAll('#tkTipo button'),function(b){b.classList.toggle('pri',b===tktp)});$('#tkHint').textContent=S.form.tipo==='planos'?'Va primero a Arquitectura por los planos → revisión del cliente → recién pasa a presupuesto.':'Va directo a Presupuestos, sin pasar por planos.';return}
    if(t.closest('#tkCreate')){var nt='TK-2026-0'+(40+tickets.length);var tk={id:nt,cliente:$('#tkCli').value,proy:($('#tkProy').value||'Nuevo proyecto'),tipo:S.form.tipo,estado:'nuevo',refrig:$('#tkRef').value,by:S.user.ini,fecha:'hoy',cotiz:null};tickets.push(tk);closeModal();render();toast('Ticket '+nt+' creado');return}
    var tka=t.closest('[data-tkact]'); if(tka){var tk=tickets.filter(function(x){return x.id===S.ticket})[0];var a=tka.getAttribute('data-tkact');
      if(a==='a-arq'){tk.estado='arquitectura';toast(tk.id+' enviado a Arquitectura')}
      else if(a==='a-presup'){tk.estado='presupuesto';spawnCotiz(tk);toast(tk.id+' → cotización '+tk.cotiz+' creada para Presupuestos')}
      else if(a==='a-revision'){tk.estado='revision-cliente';toast('Enviado a revisión del cliente')}
      else if(a==='cliente-ok'){tk.estado='presupuesto';spawnCotiz(tk);toast('Cliente aprobó → cotización '+tk.cotiz+' creada')}
      else if(a==='cliente-no'){tk.estado='cerrado';toast('Ticket cerrado — cliente rechazó')}
      renderTicket();return}
    var ocz=t.closest('[data-open-cotiz]'); if(ocz){closeTicket();openCotiz(ocz.getAttribute('data-open-cotiz'));return}
    if(t.closest('#cotClose')){closeCotiz();return}
    var ct=t.closest('[data-ctab]'); if(ct){S.ctab=ct.getAttribute('data-ctab');renderCotiz();return}
    var epa=t.closest('[data-empart-add]'); if(epa){openEmPartida(epa.getAttribute('data-empart-add'));return}
    if(t.closest('#epSave')){var cc=cotizaciones.filter(function(x){return x.id===S.form.id})[0];var d=($('#epDesc').value||'Partida').trim();var q=+$('#epCant').value||1;var pu=+$('#epPu').value||0;cc.em.push([$('#epCat').value,d,q,pu]);closeModal();renderCotiz();toast('Partida agregada');return}
    var epd=t.closest('[data-empart-del]'); if(epd){var cd=cotizaciones.filter(function(x){return x.id===S.cotiz})[0];cd.em.splice(+epd.getAttribute('data-empart-del'),1);renderCotiz();toast('Partida eliminada');return}
    var aqs=t.closest('[data-arqsync]'); if(aqs){var ca=cotizaciones.filter(function(x){return x.id===aqs.getAttribute('data-arqsync')})[0];ca.arq.act='recién';renderCotiz();toast('Monto arquitectónico sincronizado desde Arquitectura');return}
    var cta=t.closest('[data-cotact]'); if(cta){var c=cotizaciones.filter(function(x){return x.id===S.cotiz})[0];var a=cta.getAttribute('data-cotact');
      if(a==='avanzar'){var order=['solicitud','presupuesto','cotizacion','enviada'];var i=order.indexOf(c.fase);if(i<order.length-1)c.fase=order[i+1];renderCotiz();render();toast(c.id+' → '+c.fase)}
      else if(a==='aprobar'){c.fase='cerrada';c.resultado='aprobada';var np='NEW-'+(proyectos.length+1);proyectos.push({id:np,nm:c.proy,cli:(clientes.filter(function(x){return x.nm===c.cliente})[0]||{id:'agrovision'}).id,salud:80,estado:'good'});closeCotiz();render();toast(c.id+' aprobada → Proyecto "'+c.proy+'" creado ✓')}
      else if(a==='rechazar'){c.fase='cerrada';c.resultado='rechazada';closeCotiz();render();toast(c.id+' rechazada')}
      return}
    var op=t.closest('[data-open]'); if(op){openDetail(op.getAttribute('data-open'));return}
    if(t.closest('#soClose')){closeDetail();return}
    var tab=t.closest('[data-tab]'); if(tab){S.tab=tab.getAttribute('data-tab');renderDetail();return}
    var avb=t.closest('[data-av]'); if(avb){var pp=planos.filter(function(x){return x.id===S.plano})[0];if(pp){pp.av=+avb.getAttribute('data-av');if(pp.av>0&&pp.est==='backlog')pp.est='curso';renderDetail();toast('Avance actualizado a '+pp.av+'%')}return}
    var rea=t.closest('[data-reassign]'); if(rea){openModalReassign(rea.getAttribute('data-reassign'));return}
    var fl=t.closest('[data-full]'); if(fl){openFull();return}
    var zm=t.closest('[data-zoom]'); if(zm){var d=zm.getAttribute('data-zoom');S.zoom=d==='in'?Math.min(3,(S.zoom||1)+0.25):(d==='out'?Math.max(0.5,(S.zoom||1)-0.25):1);applyZoom();return}
    if(t.closest('#fullClose')||t.id==='fullScrim'){closeFull();return}
    var act=t.closest('[data-act]'); if(act){var a=act.getAttribute('data-act');var p=planos.filter(function(x){return x.id===S.plano})[0];
      if(a==='aprobar'&&p){p.est='aprobado';p.av=100;toast(p.id+' aprobado ✓');closeFull();closeDetail();render()}
      else if(a==='rechazar'&&p){p.est='curso';toast(p.id+' rechazado — vuelve al ingeniero');closeFull();closeDetail();render()}
      else if(a==='send'&&p){p.est='revision';toast(p.id+' enviado a revisión');closeFull();closeDetail();render()}
      else{toast('Observación registrada')}
      return}
    if(t.closest('[data-upload]')){toast('Formatos aceptados: PDF, DWG (AutoCAD), RVT (Revit)');return}
    if(t.closest('#newPlano')){openModalNew();return}
    var pick=t.closest('[data-pick]'); if(pick){if(S.form){S.form.resp=pick.getAttribute('data-pick');[].forEach.call(document.querySelectorAll('#modalRoot .pick'),function(b){b.classList.toggle('sel',b===pick)})}return}
    if(t.closest('[data-mclose]')||t.id==='modalScrim'){closeModal();return}
    if(t.closest('#fCreate')){if(!S.form.resp){toast('Elige un responsable');return}var spe=$('#fSpeNew').value;var nm=($('#fNombre').value||'Nuevo entregable');var code='RF-'+spe+'-'+(200+planos.length);planos.push({id:code,ti:nm,spe:spe,est:'backlog',av:0,resp:S.form.resp,proy:S.proyecto});closeModal();S.screen='planos';render();toast(code+' asignado a '+NAMES[S.form.resp]);return}
    if(t.closest('#fSave')){if(!S.form.resp){toast('Elige un responsable');return}var ppp=planos.filter(function(x){return x.id===S.form.id})[0];ppp.resp=S.form.resp;var who=NAMES[S.form.resp];closeModal();renderDetail();toast(ppp.id+' reasignado a '+who);return}
    var city=t.closest('[data-city]'); if(city){var c=city.getAttribute('data-city');var cd=$('#cityDetail');if(cd){var det={'Piura':['Túnel Congelado Piura — salud 61','Ampliación Cámara Sullana — 88%','Resp.: R. Guerra · 4 ingenieros'],'Trujillo':['Cámara Multiuso Trujillo — +22% horas'],'Lima':['5 proyectos · avance 80%'],'Chincha':['Planta Frío Chincha II — salud 54'],'Santiago':['Proyecto piloto Chile — 41%'],'Peru':['11 proyectos · avance 74%','3 en riesgo'],'Chile':['1 proyecto · avance 41%']}[c]||['Sin datos'];cd.innerHTML='<div style="font-size:11px;font-weight:660;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">'+c+' — detalle</div><div style="font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:5px">'+det.map(function(d){return '<div>· '+d+'</div>'}).join('')+'</div>'}return}
    if(t.closest('#themeBtn')){var r=document.documentElement;var cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.setAttribute('data-theme',cur==='dark'?'light':'dark');return}
    if(t.closest('#menuBtn')){sidebar.classList.toggle('open');return}
    if(t.closest('#notifBtn')){toast('3 notificaciones · 1 requiere tu acción');return}
    if(t.closest('#openCmd')){openCmd();return}
    if(t.id==='cmdkScrim'){closeCmd();return}
    var cmd=t.closest('[data-cmd]'); if(cmd){runCmd(cmd.getAttribute('data-cmd'),cmd.getAttribute('data-arg'));return}
    if(!t.closest('#userBtn')&&!t.closest('#userMenu'))$('#userMenu').classList.remove('open');
  });
  document.addEventListener('change',function(e){var t=e.target;
    if(t.id==='fSpe'){S.fSpe=t.value;render()}
    else if(t.id==='fProj'){S.fProj=t.value;render()}
    else if(t.id==='fResp'){S.fResp=t.value;render()}
    else if(t.id==='gProj'){S.gProj=t.value;S.gSpe='';render()}
    else if(t.id==='gSpe'){S.gSpe=t.value;render()}
  });
  document.addEventListener('keydown',function(e){
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(S.user)openCmd()}
    if(e.key==='Escape'){closeCmd();closeModal();closeFull();if($('#fullScrim').classList.contains('open')===false){closeDetail();closeCotiz();closeTicket()}}
    if($('#cmdkScrim').classList.contains('open')&&e.key==='Enter'){var on=$('#cmdList .cmdrow.on')||$('#cmdList .cmdrow');if(on&&on.getAttribute('data-cmd'))runCmd(on.getAttribute('data-cmd'),on.getAttribute('data-arg'))}
    if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='loginMail'){var u=users.filter(function(x){return x.mail===$('#loginMail').value.trim().toLowerCase()})[0];if(u)doLogin(u.ini)}
  });
  $('#cmdInput').addEventListener('input',function(){renderCmds(this.value)});

  renderLoginUsers();
  $('#loginScrim').classList.add('open');
})();
</script>
